version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuspilot-api
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=CampusPilot AI
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: campuspilot-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
